# Validated by scripts/validate_request.sh against schemas + capabilities/catalog.yml.

pipeline:
  name: Example_Pipeline
  description: Multi-platform pipeline generated by the CICD agent
  output_file: .github/workflows/example-pipeline.yml
  reuse_existing_if_suitable: true

platform:
  detection: auto
  override: null
  build_target: null

provider: github_actions  # or jenkins

environment: development
build_configuration: Debug
market: null
variant: null
destination: artifacts-only  # artifacts-only | testflight | firebase_app_distribution | google_play
runner_label: null

signing:
  strategy: none  # none | automatic | manual | match

capabilities:
  - build
  - unit_tests
  - artifacts
  # - ios_archive_ipa
  # - testflight
  # - firebase_app_distribution
  # - google_play_tracks
  # - notifications_teams_slack
  # - presets_variants

presets:
  enabled: false
  default: Debug-CICD
  options: [Debug-CICD, Release-CICD]
  presets_path: null
  variants_path: null

config_override:
  enabled: false
  path: .github/config-overrides/config_overrides.json

notifications:
  enabled: false
  provider: teams
  webhook_secret_or_env_name: TEAM_WEBHOOK_URL
  non_blocking: true

github_actions:
  runner_label: null
  default_branch: null
  template: mobile-ci
  reusable_workflow_ref: null

jenkins:
  output_file: Jenkinsfile
  agent_label: null
  timeout_minutes: 120
  credentials:
    fastlane_team_id: fastlane-team-id
    match_password: match-password
    firebase_sa: firebase-sa-json
