name: __PIPELINE_NAME__

on:
  push:
    branches: [__DEFAULT_BRANCH__]
  pull_request:
    branches: [__DEFAULT_BRANCH__]
  workflow_dispatch:
    inputs:
      preset:
        description: Select build type (configuration preset — not necessarily a production destination)
        type: choice
        required: true
        default: Debug-CICD
        options:
          - Debug-CICD
          - Release-CICD
      enable_notifications:
        description: Send optional chat notifications (non-blocking)
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify-triggered:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.enable_notifications == true) || vars.CICD_NOTIFICATIONS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CICD_CHAT_PROVIDER: ${{ vars.CICD_CHAT_PROVIDER }}
      TEAM_WEBHOOK_URL: ${{ secrets.TEAM_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify build triggered
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ./scripts/notify.sh triggered "$RUN_URL" "${{ github.ref_name }}"

  detect:
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.detect.outputs.platform }}
      runner: ${{ steps.detect.outputs.runner }}
      fastlane_platform: ${{ steps.detect.outputs.fastlane_platform }}
      build_target: ${{ steps.detect.outputs.build_target }}
      gradle_dir: ${{ steps.detect.outputs.gradle_dir }}
      gradle_task: ${{ steps.detect.outputs.gradle_task }}
      project_file: ${{ steps.detect.outputs.project_file }}
      default_scheme: ${{ steps.detect.outputs.default_scheme }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project platform
        id: detect
        env:
          CICD_PLATFORM: ${{ vars.CICD_PLATFORM }}
          CICD_BUILD_TARGET: ${{ vars.CICD_BUILD_TARGET }}
        run: |
          chmod +x ./scripts/detect_project_platform.sh
          PRESET="${{ github.event.inputs.preset || 'Debug-CICD' }}"
          if [[ -n "${CICD_PLATFORM:-}" && "${CICD_PLATFORM}" != "auto" ]]; then
            echo "platform=${CICD_PLATFORM}" >> "$GITHUB_OUTPUT"
            case "${CICD_PLATFORM}" in
              ios)
                echo "runner=__RUNNER_LABEL__" >> "$GITHUB_OUTPUT"
                echo "fastlane_platform=ios" >> "$GITHUB_OUTPUT"
                ;;
              android)
                echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
                echo "fastlane_platform=android" >> "$GITHUB_OUTPUT"
                echo "gradle_dir=${CICD_GRADLE_DIR:-android}" >> "$GITHUB_OUTPUT"
                if [[ "$PRESET" == "Release-CICD" ]]; then
                  echo "gradle_task=bundleRelease" >> "$GITHUB_OUTPUT"
                else
                  echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
                fi
                ;;
              flutter)
                TARGET="${CICD_BUILD_TARGET:-android}"
                echo "build_target=${TARGET}" >> "$GITHUB_OUTPUT"
                if [[ "$TARGET" == "ios" ]]; then
                  echo "runner=__RUNNER_LABEL__" >> "$GITHUB_OUTPUT"
                  echo "fastlane_platform=flutter_ios" >> "$GITHUB_OUTPUT"
                else
                  echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
                  echo "fastlane_platform=flutter_android" >> "$GITHUB_OUTPUT"
                  echo "gradle_dir=android" >> "$GITHUB_OUTPUT"
                  if [[ "$PRESET" == "Release-CICD" ]]; then
                    echo "gradle_task=bundleRelease" >> "$GITHUB_OUTPUT"
                  else
                    echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
                  fi
                fi
                ;;
              react-native)
                TARGET="${CICD_BUILD_TARGET:-android}"
                echo "build_target=${TARGET}" >> "$GITHUB_OUTPUT"
                if [[ "$TARGET" == "ios" ]]; then
                  echo "runner=__RUNNER_LABEL__" >> "$GITHUB_OUTPUT"
                  echo "fastlane_platform=react_native_ios" >> "$GITHUB_OUTPUT"
                else
                  echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
                  echo "fastlane_platform=react_native_android" >> "$GITHUB_OUTPUT"
                  echo "gradle_dir=android" >> "$GITHUB_OUTPUT"
                  if [[ "$PRESET" == "Release-CICD" ]]; then
                    echo "gradle_task=bundleRelease" >> "$GITHUB_OUTPUT"
                  else
                    echo "gradle_task=assembleDebug" >> "$GITHUB_OUTPUT"
                  fi
                fi
                ;;
            esac
          else
            ./scripts/detect_project_platform.sh --format github
            if [[ "$(grep '^runner=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)" == "macos-latest" ]]; then
              echo "runner=__RUNNER_LABEL__" >> "$GITHUB_OUTPUT"
            fi
            if [[ "$PRESET" == "Release-CICD" ]]; then
              echo "gradle_task=bundleRelease" >> "$GITHUB_OUTPUT"
            fi
          fi
          # Prefer configured project/scheme variables when present
          if [[ -n "${{ vars.CICD_PROJECT_FILE }}" ]]; then
            echo "project_file=${{ vars.CICD_PROJECT_FILE }}" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "${{ vars.CICD_DEFAULT_SCHEME }}" ]]; then
            echo "default_scheme=${{ vars.CICD_DEFAULT_SCHEME }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect
    runs-on: ${{ needs.detect.outputs.runner }}
    # Unsigned / PR CI: do not inject signing or distribution secrets here.
    env:
      CICD_PLATFORM: ${{ needs.detect.outputs.platform }}
      CICD_BUILD_TARGET: ${{ needs.detect.outputs.build_target }}
      CICD_PROJECT_FILE: ${{ needs.detect.outputs.project_file || vars.CICD_PROJECT_FILE }}
      CICD_DEFAULT_SCHEME: ${{ needs.detect.outputs.default_scheme || vars.CICD_DEFAULT_SCHEME }}
      CICD_DEFAULT_CONFIGURATION: ${{ vars.CICD_DEFAULT_CONFIGURATION }}
      CICD_TEST_DESTINATION: ${{ vars.CICD_TEST_DESTINATION }}
      CICD_GRADLE_DIR: ${{ needs.detect.outputs.gradle_dir }}
      CICD_GRADLE_TASK: ${{ needs.detect.outputs.gradle_task }}
      CICD_NODE_VERSION: ${{ vars.CICD_NODE_VERSION }}
      FASTLANE_BUNDLE_IDENTIFIER: ${{ vars.FASTLANE_BUNDLE_IDENTIFIER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        if: ${{ contains(fromJSON('["android","flutter","react-native"]'), needs.detect.outputs.platform) && needs.detect.outputs.build_target != 'ios' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        if: ${{ needs.detect.outputs.platform == 'flutter' }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Node.js
        if: ${{ needs.detect.outputs.platform == 'react-native' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.CICD_NODE_VERSION || '20' }}
          cache: npm

      - name: Setup Ruby (Fastlane)
        if: ${{ hashFiles('fastlane/Fastfile') != '' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Ruby dependencies
        if: ${{ hashFiles('fastlane/Fastfile') != '' }}
        run: bundle install

      - name: Install Node dependencies
        if: ${{ needs.detect.outputs.platform == 'react-native' && hashFiles('package-lock.json') != '' }}
        run: npm ci

      - name: Select build mode
        id: mode
        run: |
          PRESET="${{ github.event.inputs.preset || 'Debug-CICD' }}"
          if [[ "$PRESET" == "Release-CICD" ]]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "note=Release preset selects release build configuration; it does not imply a production destination." >> "$GITHUB_OUTPUT"
          else
            echo "mode=build" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Fastlane lanes
        if: ${{ hashFiles('fastlane/Fastfile') != '' }}
        id: lanes
        run: |
          chmod +x ./scripts/verify_fastlane_lanes.sh
          PLATFORM="${{ needs.detect.outputs.fastlane_platform }}"
          MODE="${{ steps.mode.outputs.mode }}"
          ./scripts/verify_fastlane_lanes.sh . "$PLATFORM" "$MODE"
          case "$PLATFORM" in
            ios) lane="ios $MODE" ;;
            android) lane="android $MODE" ;;
            flutter_android) lane="$([[ "$MODE" == release ]] && echo flutter_release_android || echo flutter_build_android)" ;;
            flutter_ios) lane="$([[ "$MODE" == release ]] && echo flutter_release_ios || echo flutter_build_ios)" ;;
            react_native_android) lane="$([[ "$MODE" == release ]] && echo react_native_release_android || echo react_native_build_android)" ;;
            react_native_ios) lane="$([[ "$MODE" == release ]] && echo react_native_release_ios || echo react_native_build_ios)" ;;
            *) echo "Unsupported Fastlane platform: $PLATFORM"; exit 1 ;;
          esac
          echo "lane=$lane" >> "$GITHUB_OUTPUT"

      - name: Run Fastlane (unsigned CI lanes)
        if: ${{ hashFiles('fastlane/Fastfile') != '' && steps.mode.outputs.mode != 'release' }}
        run: bundle exec fastlane ${{ steps.lanes.outputs.lane }}

      - name: Run Fastlane release lane
        if: ${{ hashFiles('fastlane/Fastfile') != '' && steps.mode.outputs.mode == 'release' }}
        env:
          # Signing/distribution secrets only on release job path
          FASTLANE_TEAM_ID: ${{ secrets.FASTLANE_TEAM_ID }}
          FASTLANE_ITC_TEAM_ID: ${{ secrets.FASTLANE_ITC_TEAM_ID }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CLI_TOKEN: ${{ secrets.FIREBASE_CLI_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CICD_USE_MATCH: ${{ vars.CICD_USE_MATCH }}
          CICD_DISTRIBUTE_FIREBASE: ${{ vars.CICD_DISTRIBUTE_FIREBASE }}
          CICD_UPLOAD_TESTFLIGHT: ${{ vars.CICD_UPLOAD_TESTFLIGHT }}
        run: |
          # Preferred Firebase auth: write service-account JSON to a temp file for ADC.
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            SA_PATH="${RUNNER_TEMP}/firebase-sa.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$SA_PATH"
            export GOOGLE_APPLICATION_CREDENTIALS="$SA_PATH"
          fi
          bundle exec fastlane ${{ steps.lanes.outputs.lane }}

      - name: Build iOS (xcodebuild fallback — unsigned; no archive/export/upload)
        if: ${{ needs.detect.outputs.platform == 'ios' && hashFiles('fastlane/Fastfile') == '' }}
        run: |
          PROJECT_FILE="${CICD_PROJECT_FILE:-__DEFAULT_PROJECT_FILE__}"
          SCHEME="${CICD_DEFAULT_SCHEME:-__DEFAULT_SCHEME__}"
          if [[ "${{ steps.mode.outputs.mode }}" == "release" ]]; then
            CONFIG="Release"
          else
            CONFIG="Debug"
          fi
          echo "Fallback iOS build does not archive, export IPA, or upload."
          if [[ "$PROJECT_FILE" == *.xcworkspace ]]; then
            xcodebuild -workspace "$PROJECT_FILE" -scheme "$SCHEME" -configuration "$CONFIG" \
              -destination "generic/platform=iOS Simulator" clean build CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project "$PROJECT_FILE" -scheme "$SCHEME" -configuration "$CONFIG" \
              -destination "generic/platform=iOS Simulator" clean build CODE_SIGNING_ALLOWED=NO
          fi

      - name: Build Android (Gradle fallback)
        if: ${{ needs.detect.outputs.platform == 'android' && hashFiles('fastlane/Fastfile') == '' }}
        run: |
          GRADLE_DIR="${CICD_GRADLE_DIR:-android}"
          if [[ "${{ steps.mode.outputs.mode }}" == "release" ]]; then
            TASK="${CICD_GRADLE_TASK:-bundleRelease}"
          else
            TASK="${CICD_GRADLE_TASK:-assembleDebug}"
          fi
          if [[ "$TASK" == "assembleDebug" && "${{ steps.mode.outputs.mode }}" == "release" ]]; then
            echo "Refusing silent debug fallback for release mode" >&2
            TASK="bundleRelease"
          fi
          if [[ "$GRADLE_DIR" == "." ]]; then
            ./gradlew "$TASK"
          else
            cd "$GRADLE_DIR"
            chmod +x ./gradlew
            ./gradlew "$TASK"
          fi

      - name: Build Flutter (fallback)
        if: ${{ needs.detect.outputs.platform == 'flutter' && hashFiles('fastlane/Fastfile') == '' }}
        run: |
          flutter pub get
          flutter analyze
          flutter test
          if [[ "${{ needs.detect.outputs.build_target }}" == "ios" ]]; then
            flutter build ios --no-codesign
          else
            if [[ "${{ steps.mode.outputs.mode }}" == "release" ]]; then
              flutter build appbundle --release
            else
              flutter build apk --debug
            fi
          fi

      - name: Build React Native (fallback)
        if: ${{ needs.detect.outputs.platform == 'react-native' && hashFiles('fastlane/Fastfile') == '' }}
        run: |
          if [[ "${{ needs.detect.outputs.build_target }}" == "ios" ]]; then
            npx react-native build-ios --mode Debug
          else
            cd "${CICD_GRADLE_DIR:-android}"
            chmod +x ./gradlew
            if [[ "${{ steps.mode.outputs.mode }}" == "release" ]]; then
              ./gradlew bundleRelease
            else
              ./gradlew assembleDebug
            fi
          fi

      - name: Upload build artifacts (best effort)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cicd-artifacts-${{ github.run_id }}
          path: |
            **/build/outputs/**/*.apk
            **/build/outputs/**/*.aab
            **/build/**/*.ipa
            **/fastlane/test_output/**
          if-no-files-found: ignore

  notify-completed:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.enable_notifications == true) || vars.CICD_NOTIFICATIONS_ENABLED == 'true') }}
    continue-on-error: true
    env:
      CICD_CHAT_PROVIDER: ${{ vars.CICD_CHAT_PROVIDER }}
      TEAM_WEBHOOK_URL: ${{ secrets.TEAM_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify build completed
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          STATUS="${{ needs.build.result }}"
          ./scripts/notify.sh "$STATUS" "$RUN_URL" "${{ github.ref_name }}"
