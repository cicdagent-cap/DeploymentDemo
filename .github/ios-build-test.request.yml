# Proposed first CI run request — build+test only, no distribution/notifications.
# Hosted runner selection verified against actions/runner-images macos-15 readme.
pipeline:
  name: iOS_Build_Test
  output_file: .github/workflows/ios-build-test.yml
  reuse_existing_if_suitable: false
provider: github_actions
platform:
  detection: ios
  test_destination: platform=iOS Simulator,OS=26.2,name=iPhone 16
environment: development
build_configuration: Debug
destination: artifacts-only
runner_label: macos-15
signing:
  strategy: none
capabilities:
  - build
  - unit_tests
  - artifacts
notifications:
  enabled: false
github_actions:
  runner_label: macos-15
  xcode_path: /Applications/Xcode_26.2.app
  test_destination: platform=iOS Simulator,OS=26.2,name=iPhone 16
  default_branch: main
  template: mobile-ci
