# Fill this file when asking the CICD agent to trigger an existing workflow.
# Do not store real webhook URLs, tokens, or secret values in this file.
# Workflow dispatch is a real run — not a dry-run. Requires explicit approval.

provider: github_actions  # jenkins trigger is not implemented — see docs/JENKINS.md

target:
  workflow_url: ""  # https://github.com/<owner>/<repo>/actions/workflows/<file>.yml
  branch_name: ""   # detect or ask; no organization-specific default

workflow_inputs:
  preset: Debug-CICD
  # Add only inputs discovered via inspect_workflow_inputs.sh

monitor:
  enabled: false  # requires separate approval

notification:
  enabled: false  # optional; missing webhook must not fail trigger
  provider: teams
  webhook_secret_or_env_name: TEAM_WEBHOOK_URL
