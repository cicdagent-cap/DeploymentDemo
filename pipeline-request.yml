# Fill this file when asking the CICD agent to create a new pipeline.
# The agent auto-detects platform and uses mobile-ci-workflow.template.yml.

pipeline:
  name: Demo_Pipeline
  description: Multi-platform pipeline generated by the CICD agent
  output_file: .github/workflows/demo-pipeline.yml

platform:
  detection: auto
  override: null
  build_target: android

github_actions:
  runner_label: macos-latest
  default_branch: main

presets:
  default: Debug-CICD
  options:
    - Debug-CICD
    - Release-CICD

config_override:
  input_name: config_Override
  path: .github/config-overrides/config_overrides.json
  default: None
  options:
    - None
    - 'a: Feature A Enabled'
    - 'b: Feature A Enabled + Feature B Enabled'

notifications:
  provider: teams
  webhook_secret_name: TEAM_WEBHOOK_URL
